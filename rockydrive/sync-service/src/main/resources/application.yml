server:
  port: 8084

spring:
  application:
    name: sync-service

  datasource:
    url: jdbc:postgresql://localhost:5432/rockydrive
    username: rockydrive
    password: rockydrive
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sync-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  # Shared secret with auth-service — tokens are validated locally here, never via a synchronous
  # call to auth-service. Override via JWT_SECRET env var in every real environment.
  secret: ${JWT_SECRET:dev-only-shared-secret-change-me}
